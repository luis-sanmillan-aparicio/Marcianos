<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Marcianitos - Adaptado a iPhone</title>
    <style>
        #
        
                /* Desactiva selección de texto e imágenes en toda la página */
        body {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        
        /* Evita que el navegador muestre la lupa / zoom al mantener presionado */
        * {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* En el canvas específicamente, fuerza que no haya selección ni arrastre nativo */
        canvas {
            pointer-events: auto;
            user-select: none;
            -webkit-user-drag: none;
        }




        
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        body {
            background: linear-gradient(145deg, #03050b 0%, #0a0f1f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'VT323', monospace;
            margin: 0;
            padding: 12px;
            touch-action: none;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 100%;
        }

        .game-container {
            background: #000000aa;
            border-radius: 24px;
            padding: 12px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            backdrop-filter: blur(2px);
            width: 100%;
            display: flex;
            justify-content: center;
        }

        canvas {
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 0 3px #2ecc71, 0 0 0 6px #0f380f;
            border-radius: 8px;
            cursor: none;
            touch-action: none;
            width: 100%;
            height: auto;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            background: #0c0f1cbb;
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            border-radius: 60px;
            border: 1px solid #2ecc7133;
            color: #c0ffc0;
            text-shadow: 0 0 5px #1eff00;
            font-weight: bold;
        }

        .score, .lives {
            font-size: 20px;
            letter-spacing: 1px;
            background: #00000066;
            padding: 4px 12px;
            border-radius: 40px;
            display: inline-block;
        }

        .restart-btn {
            background: #2ecc71;
            border: none;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 16px;
            padding: 5px 14px;
            border-radius: 60px;
            cursor: pointer;
            color: #0a0f1f;
            transition: all 0.1s ease;
            box-shadow: 0 3px 0 #0f380f;
            touch-action: manipulation;
        }
        .restart-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0f380f;
        }
        
        .controls-tip {
            font-size: 12px;
            background: #000000aa;
            padding: 6px 12px;
            border-radius: 50px;
            display: inline-block;
            text-align: center;
            margin-top: 10px;
            backdrop-filter: blur(4px);
            font-weight: bold;
        }
        
        @media (max-width: 550px) {
            body { padding: 8px; }
            .score, .lives { font-size: 16px; padding: 3px 10px; }
            .restart-btn { font-size: 14px; padding: 4px 12px; }
            .controls-tip { font-size: 10px; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
    <div class="info-panel">
        <div class="score">💥 PUNTOS: <span id="scoreValue">0</span></div>
        <div class="lives">🛸 VIDAS: <span id="livesValue">3</span></div>
        <button class="restart-btn" id="restartButton">🔄 NAVE NUEVA</button>
    </div>
    <div class="controls-tip">
        🎮 ARRASTRA el dedo → Mueve la nave &nbsp;&nbsp;|&nbsp;&nbsp; 👆 TOCA EN CUALQUIER LUGAR → Disparo
    </div>
</div>

<script>
    (function(){
        // ---------- CANVAS Y ESCALADO ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Dimensiones lógicas del juego (siempre 800x600 internamente)
        const LOGIC_W = 800;
        const LOGIC_H = 600;
        
        let scale = 1;      // escala actual
        let offsetX = 0;     // offset para centrar en pantalla (si hay bordes)
        
        // Función que redimensiona el canvas para que quepa en cualquier pantalla manteniendo proporción
        function resizeCanvas() {
            const container = canvas.parentElement;
            const maxWidth = container.clientWidth - 4;  // pequeño margen
            const maxHeight = window.innerHeight * 0.7;  // no exceder la altura visible
            
            // Calcular escala manteniendo proporción 800/600 = 1.333
            let newScale = Math.min(maxWidth / LOGIC_W, maxHeight / LOGIC_H);
            newScale = Math.max(0.4, Math.min(1.2, newScale)); // límites razonables
            
            const newWidth = LOGIC_W * newScale;
            const newHeight = LOGIC_H * newScale;
            
            canvas.style.width = `${newWidth}px`;
            canvas.style.height = `${newHeight}px`;
            canvas.width = LOGIC_W;
            canvas.height = LOGIC_H;
            
            scale = newScale;
            // Calcular offset para centrar horizontalmente si es necesario (normalmente sobra espacio)
            const containerRect = container.getBoundingClientRect();
            const canvasRect = canvas.getBoundingClientRect();
            offsetX = (containerRect.width - canvasRect.width) / 2;
            if(offsetX < 0) offsetX = 0;
        }
        
        // Escuchar cambios de orientación y resize
        window.addEventListener('resize', () => { resizeCanvas(); });
        window.addEventListener('orientationchange', () => { setTimeout(resizeCanvas, 50); });
        
        // ---------- CONSTANTES DE JUEGO ----------
        const PLAYER_WIDTH = 36;
        const PLAYER_HEIGHT = 24;
        let playerX = LOGIC_W/2 - PLAYER_WIDTH/2;
        const playerY = LOGIC_H - 55;
        let lives = 3;
        let score = 0;
        let gameOver = false;

        // Disparos del jugador
        let bullets = [];      
        const BULLET_W = 4;
        const BULLET_H = 12;
        const BULLET_SPEED = -6;
        let shotCooldown = 0;
        const SHOT_DELAY_FRAMES = 10;

        // ----- MARCIANITOS -----
        const INVADER_ROWS = 5;
        const INVADER_COLS = 9;
        let invaders = [];        
        let invaderDirection = 1;  
        let moveWait = 0;
        const INVADER_BASE_SPEED = 28;
        let invaderSpeed = INVADER_BASE_SPEED;
        
        let invaderOffsetX = 0;
        let invaderOffsetY = 0;
        
        // Disparos ENEMIGOS
        let enemyBullets = [];     
        const ENEMY_BULLET_W = 5;
        const ENEMY_BULLET_H = 10;
        const ENEMY_BULLET_SPEED = 4;
        let enemyShootCooldown = 0;
        const ENEMY_SHOOT_DELAY_BASE = 38;
        
        let explosionFrames = [];
        
        // ---------- CONTROL TÁCTIL: ARRASTRE Y TOQUE ----------
        let touchActive = false;
        let lastTouchX = 0;
        let pendingShoot = false;
        
        // Teclado (PC)
        const keys = { ArrowLeft: false, ArrowRight: false, Space: false };
        
        // Funciones auxiliares
        function updateUI() {
            document.getElementById('scoreValue').innerText = score;
            document.getElementById('livesValue').innerText = lives;
        }
        
        function getInvaderPos(col, row) {
            const baseX = 70;
            const baseY = 70;
            const spacingX = 72;
            const spacingY = 58;
            return {
                x: baseX + col * spacingX + invaderOffsetX,
                y: baseY + row * spacingY + invaderOffsetY,
                w: 48,
                h: 40
            };
        }
        
        function restartGame() {
            gameOver = false;
            lives = 3;
            score = 0;
            playerX = LOGIC_W/2 - PLAYER_WIDTH/2;
            bullets = [];
            enemyBullets = [];
            explosionFrames = [];
            shotCooldown = 0;
            enemyShootCooldown = 0;
            invaderDirection = 1;
            moveWait = 0;
            invaderSpeed = INVADER_BASE_SPEED;
            invaderOffsetX = 0;
            invaderOffsetY = 0;
            
            invaders = [];
            for(let row = 0; row < INVADER_ROWS; row++) {
                invaders[row] = [];
                for(let col = 0; col < INVADER_COLS; col++) {
                    invaders[row][col] = true;
                }
            }
            updateUI();
        }
        
        function shootFromPlayer() {
            if(gameOver) return;
            if(shotCooldown > 0) return;
            bullets.push({
                x: playerX + PLAYER_WIDTH/2 - BULLET_W/2,
                y: playerY - 8,
                w: BULLET_W,
                h: BULLET_H
            });
            shotCooldown = SHOT_DELAY_FRAMES;
        }
        
        function enemyShoot() {
            if(gameOver) return;
            let aliveList = [];
            for(let row=0; row<INVADER_ROWS; row++) {
                for(let col=0; col<INVADER_COLS; col++) {
                    if(invaders[row][col]) {
                        aliveList.push({row, col});
                    }
                }
            }
            if(aliveList.length === 0) return;
            const randomIndex = Math.floor(Math.random() * aliveList.length);
            const inv = aliveList[randomIndex];
            const pos = getInvaderPos(inv.col, inv.row);
            enemyBullets.push({
                x: pos.x + pos.w/2 - ENEMY_BULLET_W/2,
                y: pos.y + pos.h,
                w: ENEMY_BULLET_W,
                h: ENEMY_BULLET_H
            });
        }
        
        function rectCollide(r1, r2) {
            return !(r2.x > r1.x + r1.w ||
                r2.x + r2.w < r1.x ||
                r2.y > r1.y + r1.h ||
                r2.y + r2.h < r1.y);
        }
        
        // Conversión de coordenadas de pantalla a lógicas (para el arrastre)
        function screenToLogicX(clientX) {
            const rect = canvas.getBoundingClientRect();
            // Calculamos la posición relativa dentro del canvas visual
            const relativeX = (clientX - rect.left) / rect.width;
            // Convertimos a coordenadas lógicas (0 a LOGIC_W)
            let logicX = relativeX * LOGIC_W;
            return Math.min(Math.max(logicX, 0), LOGIC_W);
        }
        
        // Lógica principal del juego
        function updateGame() {
            if(gameOver) return;
            
            if(shotCooldown > 0) shotCooldown--;
            if(enemyShootCooldown > 0) enemyShootCooldown--;
            
            // Movimiento por teclado (PC)
            let move = 0;
            if(keys.ArrowLeft) move = -1;
            if(keys.ArrowRight) move = 1;
            if(move !== 0) {
                let speed = 7;
                let newX = playerX + move * speed;
                if(newX >= 5 && newX <= LOGIC_W - PLAYER_WIDTH - 5) {
                    playerX = newX;
                }
            }
            
            // Disparo: espacio o toque
            if((keys.Space || pendingShoot) && shotCooldown === 0 && !gameOver) {
                shootFromPlayer();
                pendingShoot = false;
            }
            
            // Mover balas jugador
            for(let i=0; i<bullets.length; i++) {
                bullets[i].y += BULLET_SPEED;
                if(bullets[i].y + BULLET_H < 0 || bullets[i].y > LOGIC_H) {
                    bullets.splice(i,1);
                    i--;
                }
            }
            
            // Colisiones balas vs invasores
            for(let i=0; i<bullets.length; i++) {
                const bullet = bullets[i];
                let hit = false;
                for(let row=0; row<INVADER_ROWS; row++) {
                    for(let col=0; col<INVADER_COLS; col++) {
                        if(invaders[row][col]) {
                            const invRect = getInvaderPos(col, row);
                            if(rectCollide(
                                {x: bullet.x, y: bullet.y, w: BULLET_W, h: BULLET_H},
                                invRect
                            )) {
                                invaders[row][col] = false;
                                hit = true;
                                score += 10;
                                updateUI();
                                explosionFrames.push({x: invRect.x+invRect.w/2, y: invRect.y+invRect.h/2, timer: 10});
                                break;
                            }
                        }
                    }
                    if(hit) break;
                }
                if(hit) {
                    bullets.splice(i,1);
                    i--;
                }
            }
            
            let aliveCount = 0;
            for(let row=0; row<INVADER_ROWS; row++)
                for(let col=0; col<INVADER_COLS; col++)
                    if(invaders[row][col]) aliveCount++;
            
            if(aliveCount === 0) {
                gameOver = true;
                return;
            }
            
            // Movimiento invasores
            if(moveWait <= 0) {
                let minX = 9999, maxX = -9999;
                for(let row=0; row<INVADER_ROWS; row++) {
                    for(let col=0; col<INVADER_COLS; col++) {
                        if(invaders[row][col]) {
                            const rect = getInvaderPos(col, row);
                            if(rect.x < minX) minX = rect.x;
                            if(rect.x + rect.w > maxX) maxX = rect.x + rect.w;
                        }
                    }
                }
                let needStepDown = false;
                if(invaderDirection === 1 && maxX >= LOGIC_W - 20) {
                    invaderDirection = -1;
                    needStepDown = true;
                } else if(invaderDirection === -1 && minX <= 15) {
                    invaderDirection = 1;
                    needStepDown = true;
                }
                
                let stepX = invaderDirection * 9;
                invaderOffsetX += stepX;
                if(needStepDown) {
                    invaderOffsetY += 18;
                    invaderSpeed = Math.max(12, invaderSpeed - 1);
                }
                moveWait = invaderSpeed;
                
                for(let row=0; row<INVADER_ROWS; row++) {
                    for(let col=0; col<INVADER_COLS; col++) {
                        if(invaders[row][col]) {
                            const invPos = getInvaderPos(col, row);
                            if(invPos.y + invPos.h >= playerY + 12) {
                                gameOver = true;
                                return;
                            }
                        }
                    }
                }
            } else {
                moveWait--;
            }
            
            if(enemyShootCooldown === 0 && aliveCount > 0 && !gameOver) {
                enemyShoot();
                enemyShootCooldown = ENEMY_SHOOT_DELAY_BASE + Math.floor(Math.random() * 15);
            }
            
            for(let i=0; i<enemyBullets.length; i++) {
                enemyBullets[i].y += ENEMY_BULLET_SPEED;
                if(enemyBullets[i].y > LOGIC_H + 50 || enemyBullets[i].y + ENEMY_BULLET_H < 0) {
                    enemyBullets.splice(i,1);
                    i--;
                    continue;
                }
                const bullet = enemyBullets[i];
                const playerRect = {x: playerX, y: playerY, w: PLAYER_WIDTH, h: PLAYER_HEIGHT};
                if(rectCollide({x: bullet.x, y: bullet.y, w: ENEMY_BULLET_W, h: ENEMY_BULLET_H}, playerRect)) {
                    lives--;
                    updateUI();
                    enemyBullets.splice(i,1);
                    i--;
                    if(lives <= 0) {
                        gameOver = true;
                    } else {
                        explosionFrames.push({x: playerX+PLAYER_WIDTH/2, y: playerY+PLAYER_HEIGHT/2, timer: 12});
                        playerX = LOGIC_W/2 - PLAYER_WIDTH/2;
                    }
                }
            }
            
            for(let i=0; i<explosionFrames.length; i++) {
                explosionFrames[i].timer--;
                if(explosionFrames[i].timer <= 0) {
                    explosionFrames.splice(i,1);
                    i--;
                }
            }
        }
        
        // Dibujo (coordenadas lógicas)
        function draw() {
            ctx.clearRect(0, 0, LOGIC_W, LOGIC_H);
            ctx.fillStyle = "#010008";
            ctx.fillRect(0,0,LOGIC_W,LOGIC_H);
            ctx.fillStyle = "#ffffff";
            for(let i=0; i<180; i++) {
                ctx.fillRect( (i*211)%LOGIC_W, (i*97)%LOGIC_H, 1.5, 1.5);
            }
            
            ctx.fillStyle = "#4eff6e";
            ctx.fillRect(playerX, playerY, PLAYER_WIDTH, PLAYER_HEIGHT);
            ctx.fillStyle = "#b3ffb3";
            ctx.fillRect(playerX+6, playerY-6, 24, 8);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(playerX+14, playerY-3, 8, 5);
            
            for(let row=0; row<INVADER_ROWS; row++) {
                for(let col=0; col<INVADER_COLS; col++) {
                    if(invaders[row][col]) {
                        const pos = getInvaderPos(col, row);
                        if(row===0) ctx.fillStyle = "#ffc857";
                        else if(row===1) ctx.fillStyle = "#7eff6e";
                        else ctx.fillStyle = "#40c94b";
                        ctx.fillRect(pos.x, pos.y, pos.w, pos.h);
                        ctx.fillStyle = "#000000";
                        ctx.fillRect(pos.x+10, pos.y+12, 8, 8);
                        ctx.fillRect(pos.x+30, pos.y+12, 8, 8);
                        ctx.fillStyle = "#ffaa44";
                        ctx.fillRect(pos.x+20, pos.y+28, 8, 6);
                        ctx.fillStyle = "#90ff70";
                        ctx.fillRect(pos.x+22, pos.y-5, 4, 8);
                    }
                }
            }
            
            ctx.fillStyle = "#ffff60";
            for(let b of bullets) ctx.fillRect(b.x, b.y, BULLET_W, BULLET_H);
            ctx.fillStyle = "#ff5555";
            for(let eb of enemyBullets) ctx.fillRect(eb.x, eb.y, ENEMY_BULLET_W, ENEMY_BULLET_H);
            
            for(let ex of explosionFrames) {
                ctx.fillStyle = `rgba(255, 140, 30, ${ex.timer/8})`;
                ctx.beginPath();
                ctx.arc(ex.x, ex.y, 12 - (ex.timer/2), 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = `rgba(255, 80, 30, 0.9)`;
                ctx.beginPath();
                ctx.arc(ex.x-2, ex.y-2, 5, 0, Math.PI*2);
                ctx.fill();
            }
            
            if(gameOver) {
                let aliveCount = 0;
                for(let row=0; row<INVADER_ROWS; row++)
                    for(let col=0; col<INVADER_COLS; col++)
                        if(invaders[row][col]) aliveCount++;
                let msg = (aliveCount === 0) ? "🌟 ¡VICTORIA! 🌟" : "💀 GAME OVER 💀";
                ctx.font = "bold 34px monospace";
                ctx.fillStyle = "#fffdd0";
                ctx.shadowColor = "black";
                ctx.fillText(msg, LOGIC_W/2-130, LOGIC_H/2-40);
                ctx.font = "18px monospace";
                ctx.fillStyle = "#aaffaa";
                ctx.fillText("Presiona 'NUEVA NAVE'", LOGIC_W/2-100, LOGIC_H/2+30);
            }
            
            ctx.font = "bold 16px monospace";
            ctx.fillStyle = "#b3ffb3";
            ctx.fillText("👾 INVASORES", 20, 35);
        }
        
        // ----- EVENTOS TÁCTILES CON COORDENADAS ADAPTADAS -----
        let touchStartTime = 0;
        let touchStartLogicX = 0;
        let hasMovedSignificantly = false;
        
        function onTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const logicX = screenToLogicX(touch.clientX);
            
            touchStartTime = Date.now();
            touchStartLogicX = logicX;
            hasMovedSignificantly = false;
            
            // Posicionar nave directamente bajo el dedo
            let newPlayerX = logicX - PLAYER_WIDTH/2;
            newPlayerX = Math.min(Math.max(newPlayerX, 5), LOGIC_W - PLAYER_WIDTH - 5);
            playerX = newPlayerX;
            touchActive = true;
            lastTouchX = logicX;
        }
        
        function onTouchMove(e) {
            e.preventDefault();
            if(!touchActive) return;
            const touch = e.touches[0];
            const logicX = screenToLogicX(touch.clientX);
            let delta = logicX - lastTouchX;
            if(Math.abs(delta) > 3) hasMovedSignificantly = true;
            let newX = playerX + delta;
            newX = Math.min(Math.max(newX, 5), LOGIC_W - PLAYER_WIDTH - 5);
            playerX = newX;
            lastTouchX = logicX;
        }
        
        function onTouchEnd(e) {
            e.preventDefault();
            touchActive = false;
            let duration = Date.now() - touchStartTime;
            // Si fue un toque rápido sin arrastre significativo → disparo
            if(!hasMovedSignificantly && duration < 200) {
                pendingShoot = true;
            }
        }
        
        canvas.addEventListener('touchstart', onTouchStart, {passive: false});
        canvas.addEventListener('touchmove', onTouchMove, {passive: false});
        canvas.addEventListener('touchend', onTouchEnd);
        canvas.addEventListener('touchcancel', onTouchEnd);
        
        // Eventos de ratón para PC/pruebas
        let mouseDown = false;
        let mouseMoved = false;
        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const relativeX = (e.clientX - rect.left) / rect.width;
            let logicX = relativeX * LOGIC_W;
            let newX = logicX - PLAYER_WIDTH/2;
            newX = Math.min(Math.max(newX, 5), LOGIC_W - PLAYER_WIDTH - 5);
            playerX = newX;
            mouseDown = true;
            mouseMoved = false;
        });
        canvas.addEventListener('mousemove', (e) => {
            if(mouseDown) {
                mouseMoved = true;
                const rect = canvas.getBoundingClientRect();
                const relativeX = (e.clientX - rect.left) / rect.width;
                let logicX = relativeX * LOGIC_W;
                let newX = logicX - PLAYER_WIDTH/2;
                newX = Math.min(Math.max(newX, 5), LOGIC_W - PLAYER_WIDTH - 5);
                playerX = newX;
            }
        });
        canvas.addEventListener('mouseup', (e) => {
            if(mouseDown && !mouseMoved) pendingShoot = true;
            mouseDown = false;
        });
        
        // Teclado
        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft') { keys.ArrowLeft = true; e.preventDefault(); }
            else if(e.key === 'ArrowRight') { keys.ArrowRight = true; e.preventDefault(); }
            else if(e.key === ' ' || e.key === 'Space') { keys.Space = true; e.preventDefault(); }
        });
        window.addEventListener('keyup', (e) => {
            if(e.key === 'ArrowLeft') keys.ArrowLeft = false;
            else if(e.key === 'ArrowRight') keys.ArrowRight = false;
            else if(e.key === ' ' || e.key === 'Space') keys.Space = false;
        });
        
        document.getElementById('restartButton').addEventListener('click', () => { restartGame(); gameOver = false; });
        document.getElementById('restartButton').addEventListener('touchstart', (e) => { e.preventDefault(); restartGame(); gameOver = false; });
        
        // Inicializar
        restartGame();
        resizeCanvas();
        updateUI();
        
        function gameLoop() {
            updateGame();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    })();
</script>
</body>
</html>
