<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Marcianitos - Control por Arrastre y Toque</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none; /* Previene scroll/zoom mientras se juega */
        }

        body {
            background: linear-gradient(145deg, #03050b 0%, #0a0f1f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'VT323', monospace;
            margin: 0;
            padding: 16px;
            touch-action: none;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-container {
            background: #000000aa;
            border-radius: 32px;
            padding: 16px 20px 20px 20px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            backdrop-filter: blur(2px);
        }

        canvas {
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 0 4px #2ecc71, 0 0 0 8px #0f380f;
            border-radius: 8px;
            cursor: none;
            touch-action: none;  /* Importante para capturar arrastres */
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
            background: #0c0f1cbb;
            backdrop-filter: blur(4px);
            padding: 8px 18px;
            border-radius: 60px;
            border: 1px solid #2ecc7133;
            color: #c0ffc0;
            text-shadow: 0 0 5px #1eff00;
            font-weight: bold;
        }

        .score, .lives {
            font-size: 26px;
            letter-spacing: 2px;
            background: #00000066;
            padding: 4px 16px;
            border-radius: 40px;
            display: inline-block;
        }

        .restart-btn {
            background: #2ecc71;
            border: none;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 20px;
            padding: 6px 18px;
            border-radius: 60px;
            cursor: pointer;
            color: #0a0f1f;
            transition: all 0.1s ease;
            box-shadow: 0 3px 0 #0f380f;
            touch-action: manipulation;
        }
        .restart-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0f380f;
        }
        
        .controls-tip {
            font-size: 15px;
            background: #000000aa;
            padding: 8px 18px;
            border-radius: 50px;
            display: inline-block;
            text-align: center;
            margin-top: 12px;
            backdrop-filter: blur(4px);
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        @media (max-width: 780px) {
            .game-container { padding: 12px; }
            .score, .lives { font-size: 20px; }
            .restart-btn { font-size: 16px; padding: 4px 14px; }
            .controls-tip { font-size: 13px; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="info-panel">
            <div class="score">💥 PUNTOS: <span id="scoreValue">0</span></div>
            <div class="lives">🛸 VIDAS: <span id="livesValue">3</span></div>
            <button class="restart-btn" id="restartButton">🔄 NAVE NUEVA</button>
        </div>
        <div class="controls-tip">
            🎮 ARRASTRA el dedo → Mueve la nave &nbsp;&nbsp;|&nbsp;&nbsp; 👆 TOCA EN CUALQUIER LUGAR → Disparo láser
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- CANVAS ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ---------- CONSTANTES DE JUEGO ----------
        const W = 800, H = 600;
        const PLAYER_WIDTH = 36;
        const PLAYER_HEIGHT = 24;
        let playerX = W/2 - PLAYER_WIDTH/2;
        const playerY = H - 55;
        let lives = 3;
        let score = 0;
        let gameOver = false;

        // Disparos del jugador
        let bullets = [];      
        const BULLET_W = 4;
        const BULLET_H = 12;
        const BULLET_SPEED = -6;
        let shotCooldown = 0;
        const SHOT_DELAY_FRAMES = 10;  // cadencia rápida pero justa

        // ----- MARCIANITOS -----
        const INVADER_ROWS = 5;
        const INVADER_COLS = 9;
        let invaders = [];        
        let invaderDirection = 1;  
        let moveWait = 0;
        const INVADER_BASE_SPEED = 28;
        let invaderSpeed = INVADER_BASE_SPEED;
        
        // Desplazamiento de invasores (para movimiento lateral y bajada)
        let invaderOffsetX = 0;
        let invaderOffsetY = 0;
        
        // Disparos ENEMIGOS
        let enemyBullets = [];     
        const ENEMY_BULLET_W = 5;
        const ENEMY_BULLET_H = 10;
        const ENEMY_BULLET_SPEED = 4;
        let enemyShootCooldown = 0;
        const ENEMY_SHOOT_DELAY_BASE = 38;
        
        // Efectos visuales
        let explosionFrames = [];
        
        // ---------- CONTROL TÁCTIL: ARRASTRE Y TOQUE ----------
        let touchActive = false;      // Si el dedo está deslizando sobre el canvas
        let lastTouchX = 0;           // Última posición X del toque (para arrastre diferencial)
        
        // Disparo por toque (sin arrastre, simplemente tocar)
        let pendingShoot = false;
        
        // También mantenemos compatibilidad con teclado por si alguien juega en PC
        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            Space: false
        };
        
        // ---------- FUNCIONES AUX ----------
        function updateUI() {
            document.getElementById('scoreValue').innerText = score;
            document.getElementById('livesValue').innerText = lives;
        }
        
        // Obtener posición real de cada invasor según offset dinámico
        function getInvaderPos(col, row) {
            const baseX = 70;
            const baseY = 70;
            const spacingX = 72;
            const spacingY = 58;
            return {
                x: baseX + col * spacingX + invaderOffsetX,
                y: baseY + row * spacingY + invaderOffsetY,
                w: 48,
                h: 40
            };
        }
        
        // Reinicio completo del juego
        function restartGame() {
            gameOver = false;
            lives = 3;
            score = 0;
            playerX = W/2 - PLAYER_WIDTH/2;
            bullets = [];
            enemyBullets = [];
            explosionFrames = [];
            shotCooldown = 0;
            enemyShootCooldown = 0;
            invaderDirection = 1;
            moveWait = 0;
            invaderSpeed = INVADER_BASE_SPEED;
            invaderOffsetX = 0;
            invaderOffsetY = 0;
            
            // Reiniciar matriz de invasores (todos vivos)
            invaders = [];
            for(let row = 0; row < INVADER_ROWS; row++) {
                invaders[row] = [];
                for(let col = 0; col < INVADER_COLS; col++) {
                    invaders[row][col] = true;
                }
            }
            updateUI();
        }
        
        // Disparo del jugador
        function shootFromPlayer() {
            if(gameOver) return;
            if(shotCooldown > 0) return;
            bullets.push({
                x: playerX + PLAYER_WIDTH/2 - BULLET_W/2,
                y: playerY - 8,
                w: BULLET_W,
                h: BULLET_H
            });
            shotCooldown = SHOT_DELAY_FRAMES;
        }
        
        // Disparo enemigo desde un invasor aleatorio vivo
        function enemyShoot() {
            if(gameOver) return;
            let aliveList = [];
            for(let row=0; row<INVADER_ROWS; row++) {
                for(let col=0; col<INVADER_COLS; col++) {
                    if(invaders[row][col]) {
                        aliveList.push({row, col});
                    }
                }
            }
            if(aliveList.length === 0) return;
            const randomIndex = Math.floor(Math.random() * aliveList.length);
            const inv = aliveList[randomIndex];
            const pos = getInvaderPos(inv.col, inv.row);
            enemyBullets.push({
                x: pos.x + pos.w/2 - ENEMY_BULLET_W/2,
                y: pos.y + pos.h,
                w: ENEMY_BULLET_W,
                h: ENEMY_BULLET_H
            });
        }
        
        // Colisión rectángulos
        function rectCollide(r1, r2) {
            return !(r2.x > r1.x + r1.w ||
                r2.x + r2.w < r1.x ||
                r2.y > r1.y + r1.h ||
                r2.y + r2.h < r1.y);
        }
        
        // Lógica principal del juego (movimiento, colisiones, etc.)
        function updateGame() {
            if(gameOver) return;
            
            // Cooldowns
            if(shotCooldown > 0) shotCooldown--;
            if(enemyShootCooldown > 0) enemyShootCooldown--;
            
            // ----- MOVIMIENTO DE LA NAVE (por teclado o por arrastre táctil) -----
            // El arrastre táctil se maneja en eventos aparte, modificando playerX directamente.
            // Para teclado:
            let move = 0;
            if(keys.ArrowLeft) move = -1;
            if(keys.ArrowRight) move = 1;
            if(move !== 0) {
                let speed = 7;
                let newX = playerX + move * speed;
                if(newX >= 5 && newX <= W - PLAYER_WIDTH - 5) {
                    playerX = newX;
                }
            }
            
            // Disparo: por tecla espacio o por evento táctil de toque (pendingShoot)
            if((keys.Space || pendingShoot) && shotCooldown === 0 && !gameOver) {
                shootFromPlayer();
                pendingShoot = false;  // consumir el disparo táctil
            }
            
            // Mover balas del jugador
            for(let i=0; i<bullets.length; i++) {
                bullets[i].y += BULLET_SPEED;
                if(bullets[i].y + BULLET_H < 0 || bullets[i].y > H) {
                    bullets.splice(i,1);
                    i--;
                }
            }
            
            // COLISIONES balas vs invasores
            for(let i=0; i<bullets.length; i++) {
                const bullet = bullets[i];
                let hit = false;
                for(let row=0; row<INVADER_ROWS; row++) {
                    for(let col=0; col<INVADER_COLS; col++) {
                        if(invaders[row][col]) {
                            const invRect = getInvaderPos(col, row);
                            if(rectCollide(
                                {x: bullet.x, y: bullet.y, w: BULLET_W, h: BULLET_H},
                                invRect
                            )) {
                                invaders[row][col] = false;
                                hit = true;
                                score += 10;
                                updateUI();
                                explosionFrames.push({x: invRect.x+invRect.w/2, y: invRect.y+invRect.h/2, timer: 10});
                                break;
                            }
                        }
                    }
                    if(hit) break;
                }
                if(hit) {
                    bullets.splice(i,1);
                    i--;
                }
            }
            
            // Contar invasores vivos
            let aliveCount = 0;
            for(let row=0; row<INVADER_ROWS; row++)
                for(let col=0; col<INVADER_COLS; col++)
                    if(invaders[row][col]) aliveCount++;
            
            if(aliveCount === 0) {
                gameOver = true;
                return;
            }
            
            // Movimiento de invasores (con offset)
            if(moveWait <= 0) {
                let minX = 9999, maxX = -9999;
                for(let row=0; row<INVADER_ROWS; row++) {
                    for(let col=0; col<INVADER_COLS; col++) {
                        if(invaders[row][col]) {
                            const rect = getInvaderPos(col, row);
                            if(rect.x < minX) minX = rect.x;
                            if(rect.x + rect.w > maxX) maxX = rect.x + rect.w;
                        }
                    }
                }
                let needStepDown = false;
                if(invaderDirection === 1 && maxX >= W - 20) {
                    invaderDirection = -1;
                    needStepDown = true;
                } else if(invaderDirection === -1 && minX <= 15) {
                    invaderDirection = 1;
                    needStepDown = true;
                }
                
                let stepX = invaderDirection * 9;
                invaderOffsetX += stepX;
                if(needStepDown) {
                    invaderOffsetY += 18;
                    invaderSpeed = Math.max(12, invaderSpeed - 1);
                }
                moveWait = invaderSpeed;
                
                // Derrota si los invasores alcanzan la base del jugador
                for(let row=0; row<INVADER_ROWS; row++) {
                    for(let col=0; col<INVADER_COLS; col++) {
                        if(invaders[row][col]) {
                            const invPos = getInvaderPos(col, row);
                            if(invPos.y + invPos.h >= playerY + 12) {
                                gameOver = true;
                                return;
                            }
                        }
                    }
                }
            } else {
                moveWait--;
            }
            
            // Disparos enemigos periódicos
            if(enemyShootCooldown === 0 && aliveCount > 0 && !gameOver) {
                enemyShoot();
                enemyShootCooldown = ENEMY_SHOOT_DELAY_BASE + Math.floor(Math.random() * 15);
            }
            
            // Mover balas enemigas y colisión con el jugador
            for(let i=0; i<enemyBullets.length; i++) {
                enemyBullets[i].y += ENEMY_BULLET_SPEED;
                if(enemyBullets[i].y > H + 50 || enemyBullets[i].y + ENEMY_BULLET_H < 0) {
                    enemyBullets.splice(i,1);
                    i--;
                    continue;
                }
                const bullet = enemyBullets[i];
                const playerRect = {x: playerX, y: playerY, w: PLAYER_WIDTH, h: PLAYER_HEIGHT};
                if(rectCollide({x: bullet.x, y: bullet.y, w: ENEMY_BULLET_W, h: ENEMY_BULLET_H}, playerRect)) {
                    lives--;
                    updateUI();
                    enemyBullets.splice(i,1);
                    i--;
                    if(lives <= 0) {
                        gameOver = true;
                    } else {
                        explosionFrames.push({x: playerX+PLAYER_WIDTH/2, y: playerY+PLAYER_HEIGHT/2, timer: 12});
                        playerX = W/2 - PLAYER_WIDTH/2; // reubicar nave al centro tras impacto
                    }
                }
            }
            
            // Actualizar explosiones visuales
            for(let i=0; i<explosionFrames.length; i++) {
                explosionFrames[i].timer--;
                if(explosionFrames[i].timer <= 0) {
                    explosionFrames.splice(i,1);
                    i--;
                }
            }
        }
        
        // ---------- DIBUJO DEL JUEGO (estilo retro) ----------
        function draw() {
            ctx.clearRect(0, 0, W, H);
            // Fondo espacial
            ctx.fillStyle = "#010008";
            ctx.fillRect(0,0,W,H);
            ctx.fillStyle = "#ffffff";
            for(let i=0; i<180; i++) {
                ctx.fillRect( (i*211)%W, (i*97)%H, 1.5, 1.5);
            }
            
            // Nave del jugador (verde brillante)
            ctx.fillStyle = "#4eff6e";
            ctx.fillRect(playerX, playerY, PLAYER_WIDTH, PLAYER_HEIGHT);
            ctx.fillStyle = "#b3ffb3";
            ctx.fillRect(playerX+6, playerY-6, 24, 8);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(playerX+14, playerY-3, 8, 5);
            
            // Marcianos (con offset dinámico)
            for(let row=0; row<INVADER_ROWS; row++) {
                for(let col=0; col<INVADER_COLS; col++) {
                    if(invaders[row][col]) {
                        const pos = getInvaderPos(col, row);
                        // Colores diferentes por fila
                        if(row===0) ctx.fillStyle = "#ffc857";
                        else if(row===1) ctx.fillStyle = "#7eff6e";
                        else ctx.fillStyle = "#40c94b";
                        ctx.fillRect(pos.x, pos.y, pos.w, pos.h);
                        ctx.fillStyle = "#000000";
                        ctx.fillRect(pos.x+10, pos.y+12, 8, 8);
                        ctx.fillRect(pos.x+30, pos.y+12, 8, 8);
                        ctx.fillStyle = "#ffaa44";
                        ctx.fillRect(pos.x+20, pos.y+28, 8, 6);
                        ctx.fillStyle = "#90ff70";
                        ctx.fillRect(pos.x+22, pos.y-5, 4, 8);
                    }
                }
            }
            
            // Balas
            ctx.fillStyle = "#ffff60";
            for(let b of bullets) ctx.fillRect(b.x, b.y, BULLET_W, BULLET_H);
            ctx.fillStyle = "#ff5555";
            for(let eb of enemyBullets) ctx.fillRect(eb.x, eb.y, ENEMY_BULLET_W, ENEMY_BULLET_H);
            
            // Explosiones
            for(let ex of explosionFrames) {
                ctx.fillStyle = `rgba(255, 140, 30, ${ex.timer/8})`;
                ctx.beginPath();
                ctx.arc(ex.x, ex.y, 12 - (ex.timer/2), 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = `rgba(255, 80, 30, 0.9)`;
                ctx.beginPath();
                ctx.arc(ex.x-2, ex.y-2, 5, 0, Math.PI*2);
                ctx.fill();
            }
            
            // Mensajes de estado final
            if(gameOver) {
                let aliveCount = 0;
                for(let row=0; row<INVADER_ROWS; row++)
                    for(let col=0; col<INVADER_COLS; col++)
                        if(invaders[row][col]) aliveCount++;
                let msg = (aliveCount === 0) ? "🌟 ¡VICTORIA! 🌟" : "💀 GAME OVER 💀";
                ctx.font = "bold 34monospace";
                ctx.fillStyle = "#fffdd0";
                ctx.shadowColor = "black";
                ctx.fillText(msg, W/2-130, H/2-40);
                ctx.font = "18px monospace";
                ctx.fillStyle = "#aaffaa";
                ctx.fillText("Presiona 'NUEVA NAVE'", W/2-100, H/2+30);
            }
            
            ctx.font = "bold 16px monospace";
            ctx.fillStyle = "#b3ffb3";
            ctx.fillText("👾 INVASORES", 20, 35);
        }
        
        // ---------- EVENTOS: ARRASTRE Y TOQUE (el corazón del control táctil) ----------
        function handleTouchStart(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            let touchX = (e.touches[0].clientX - rect.left) * scaleX;
            touchX = Math.min(Math.max(touchX, 5), W - PLAYER_WIDTH - 5);
            // Colocar la nave directamente bajo el dedo al comenzar el arrastre
            playerX = touchX - PLAYER_WIDTH/2;
            playerX = Math.min(Math.max(playerX, 5), W - PLAYER_WIDTH - 5);
            touchActive = true;
            lastTouchX = touchX;
        }
        
        function handleTouchMove(e) {
            e.preventDefault();
            if(!touchActive) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            let currentTouchX = (e.touches[0].clientX - rect.left) * scaleX;
            // Mover la nave proporcionalmente al arrastre
            let delta = currentTouchX - lastTouchX;
            let newX = playerX + delta;
            newX = Math.min(Math.max(newX, 5), W - PLAYER_WIDTH - 5);
            playerX = newX;
            lastTouchX = currentTouchX;
        }
        
        function handleTouchEnd(e) {
            e.preventDefault();
            touchActive = false;
            // IMPORTANTE: Al levantar el dedo, si NO hubo arrastre significativo, consideramos un toque para disparar.
            // Para distinguir toque vs arrastre: Si el tiempo fue muy corto y movimiento mínimo, disparamos.
            // Usaremos un flag sencillo: Al iniciar toque registramos timestamp y posición, al soltar comparamos.
            // Pero implementaremos disparo solo si no hubo movimiento relevante.
            // Como hay eventos touchstart y touchend, lo haremos de forma elegante con variable.
        }
        
        // Detectores de toque para disparo (toque sin arrastre) y arrastre simultáneo.
        let touchStartTime = 0;
        let touchStartX = 0;
        let touchStartY = 0;
        let hasMovedSignificantly = false;
        
        function onTouchStartGlobal(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let canvasX = (e.touches[0].clientX - rect.left) * scaleX;
            let canvasY = (e.touches[0].clientY - rect.top) * scaleY;
            touchStartTime = Date.now();
            touchStartX = canvasX;
            touchStartY = canvasY;
            hasMovedSignificantly = false;
            
            // También iniciamos arrastre directamente
            handleTouchStart(e);
        }
        
        function onTouchMoveGlobal(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let currentX = (e.touches[0].clientX - rect.left) * scaleX;
            let currentY = (e.touches[0].clientY - rect.top) * scaleY;
            let dist = Math.hypot(currentX - touchStartX, currentY - touchStartY);
            if(dist > 12) {
                hasMovedSignificantly = true;
            }
            handleTouchMove(e);
        }
        
        function onTouchEndGlobal(e) {
            e.preventDefault();
            handleTouchEnd(e);
            // Si el dedo se levantó rápido y sin movimiento significativo → DISPARO
            let duration = Date.now() - touchStartTime;
            if(!hasMovedSignificantly && duration < 200) {
                pendingShoot = true;
            }
            touchActive = false;
        }
        
        // Registrar eventos táctiles en el canvas
        canvas.addEventListener('touchstart', onTouchStartGlobal, {passive: false});
        canvas.addEventListener('touchmove', onTouchMoveGlobal, {passive: false});
        canvas.addEventListener('touchend', onTouchEndGlobal);
        canvas.addEventListener('touchcancel', onTouchEndGlobal);
        
        // Prevenir arrastres por defecto en el canvas también con mouse (para depuración PC)
        canvas.addEventListener('dragstart', (e) => e.preventDefault());
        
        // También para mouse (opcional, para pruebas en PC: arrastrar con ratón y click dispara)
        let mouseDown = false;
        let mouseMoved = false;
        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            mouseDown = true;
            mouseMoved = false;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            let mouseX = (e.clientX - rect.left) * scaleX;
            playerX = Math.min(Math.max(mouseX - PLAYER_WIDTH/2, 5), W - PLAYER_WIDTH - 5);
        });
        canvas.addEventListener('mousemove', (e) => {
            if(mouseDown) {
                mouseMoved = true;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                let mouseX = (e.clientX - rect.left) * scaleX;
                playerX = Math.min(Math.max(mouseX - PLAYER_WIDTH/2, 5), W - PLAYER_WIDTH - 5);
            }
        });
        canvas.addEventListener('mouseup', (e) => {
            if(mouseDown && !mouseMoved) {
                pendingShoot = true;
            }
            mouseDown = false;
        });
        
        // Teclado (PC)
        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft') { keys.ArrowLeft = true; e.preventDefault(); }
            else if(e.key === 'ArrowRight') { keys.ArrowRight = true; e.preventDefault(); }
            else if(e.key === ' ' || e.key === 'Space') { keys.Space = true; e.preventDefault(); }
        });
        window.addEventListener('keyup', (e) => {
            if(e.key === 'ArrowLeft') keys.ArrowLeft = false;
            else if(e.key === 'ArrowRight') keys.ArrowRight = false;
            else if(e.key === ' ' || e.key === 'Space') keys.Space = false;
        });
        
        // Botón de reinicio
        document.getElementById('restartButton').addEventListener('click', () => {
            restartGame();
            gameOver = false;
        });
        document.getElementById('restartButton').addEventListener('touchstart', (e) => {
            e.preventDefault();
            restartGame();
            gameOver = false;
        });
        
        // Iniciar juego
        restartGame();
        updateUI();
        function gameLoop() {
            updateGame();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    })();
</script>
