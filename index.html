<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Marcianitos - Space Invaders Clásico</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #03050b 0%, #0a0f1f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'VT323', monospace;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background: #000000aa;
            border-radius: 32px;
            padding: 20px 25px 25px 25px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            backdrop-filter: blur(2px);
        }

        canvas {
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 0 4px #2ecc71, 0 0 0 8px #0f380f;
            border-radius: 8px;
            cursor: none;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 18px;
            background: #0c0f1cbb;
            backdrop-filter: blur(4px);
            padding: 10px 20px;
            border-radius: 60px;
            border: 1px solid #2ecc7133;
            color: #c0ffc0;
            text-shadow: 0 0 5px #1eff00;
            font-weight: bold;
        }

        .score, .lives {
            font-size: 28px;
            letter-spacing: 2px;
            background: #00000066;
            padding: 4px 16px;
            border-radius: 40px;
            display: inline-block;
        }

        .restart-btn {
            background: #2ecc71;
            border: none;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 20px;
            padding: 6px 18px;
            border-radius: 60px;
            cursor: pointer;
            color: #0a0f1f;
            transition: all 0.1s ease;
            box-shadow: 0 3px 0 #0f380f;
        }
        .restart-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0f380f;
        }
        .controls-tip {
            font-size: 14px;
            background: #00000088;
            padding: 6px 14px;
            border-radius: 50px;
            display: inline-block;
        }
        @media (max-width: 780px) {
            .game-container { padding: 12px; }
            .score, .lives { font-size: 22px; }
            .restart-btn { font-size: 16px; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="info-panel">
            <div class="score">💥 PUNTOS: <span id="scoreValue">0</span></div>
            <div class="lives">🛸 VIDAS: <span id="livesValue">3</span></div>
            <button class="restart-btn" id="restartButton">🔄 NAVE NUEVA</button>
        </div>
        <div class="controls-tip" style="margin-top: 12px; text-align:center;">
            🎮 [ ← → ] mover nave &nbsp;&nbsp;|&nbsp;&nbsp; [ ESPACIO ] disparar &nbsp;&nbsp;|&nbsp;&nbsp; ☄️ ¡Destruye los marcianitos!
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- CANVAS ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ---------- CONSTANTES DE JUEGO ----------
        const W = 800, H = 600;
        // Nave
        const PLAYER_WIDTH = 36;
        const PLAYER_HEIGHT = 24;
        let playerX = W/2 - PLAYER_WIDTH/2;
        const playerY = H - 55;
        let lives = 3;
        let score = 0;
        let gameOver = false;

        // Disparos del jugador
        let bullets = [];      // cada bullet: { x, y, active }
        const BULLET_W = 4;
        const BULLET_H = 12;
        const BULLET_SPEED = -6;
        let shotCooldown = 0;
        const SHOT_DELAY_FRAMES = 12;  // cadencia

        // ----- MARCIANITOS (INVADERS) -----
        const INVADER_ROWS = 5;
        const INVADER_COLS = 9;
        let invaders = [];        // matriz 5x9 con boolean (true=vivo)
        let invaderDirection = 1;  // 1 derecha, -1 izquierda
        let invaderStepDown = false;
        let invaderMoveCounter = 0;
        const INVADER_BASE_SPEED = 28;   // frames por movimiento (más bajo = más rápido)
        let invaderSpeed = INVADER_BASE_SPEED;
        let moveWait = 0;
        
        // Disparos ENEMIGOS
        let enemyBullets = [];     // { x, y, active }
        const ENEMY_BULLET_W = 5;
        const ENEMY_BULLET_H = 10;
        const ENEMY_BULLET_SPEED = 4;
        let enemyShootCooldown = 0;
        const ENEMY_SHOOT_DELAY_BASE = 38;
        let enemyShootDelay = ENEMY_SHOOT_DELAY_BASE;
        
        // Animación y efectos
        let explosionFrames = [];  // simple lista de {x, y, timer}
        
        // Control de teclado
        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            Space: false
        };
        
        let lastShotFrame = 0;
        
        // ---------- FUNCIONES AUX ----------
        function updateUI() {
            document.getElementById('scoreValue').innerText = score;
            document.getElementById('livesValue').innerText = lives;
        }
        
        // Reinicio total
        function restartGame() {
            gameOver = false;
            lives = 3;
            score = 0;
            playerX = W/2 - PLAYER_WIDTH/2;
            bullets = [];
            enemyBullets = [];
            explosionFrames = [];
            shotCooldown = 0;
            enemyShootCooldown = 0;
            invaderDirection = 1;
            moveWait = 0;
            invaderSpeed = INVADER_BASE_SPEED;
            // reiniciar invaders matriz
            invaders = [];
            for(let row = 0; row < INVADER_ROWS; row++) {
                invaders[row] = [];
                for(let col = 0; col < INVADER_COLS; col++) {
                    invaders[row][col] = true;
                }
            }
            updateUI();
            // reset posiciones visuales (se reubicarán en draw en base a la matriz)
        }
        
        // Colisiones círculo/rectángulo simplificada para marciano/bala
        function rectCollide(r1, r2) {
            return !(r2.x > r1.x + r1.w ||
                r2.x + r2.w < r1.x ||
                r2.y > r1.y + r1.h ||
                r2.y + r2.h < r1.y);
        }
        
        // Disparo jugador
        function shootFromPlayer() {
            if(gameOver) return;
            if(shotCooldown > 0) return;
            bullets.push({
                x: playerX + PLAYER_WIDTH/2 - BULLET_W/2,
                y: playerY - 8,
                active: true,
                w: BULLET_W,
                h: BULLET_H
            });
            shotCooldown = SHOT_DELAY_FRAMES;
            // pequeño sonido virtual (visual feedback)
        }
        
        // Disparo enemigo desde un invader aleatorio vivo
        function enemyShoot() {
            if(gameOver) return;
            // recolectar todos los invasores vivos
            let aliveList = [];
            for(let row=0; row<INVADER_ROWS; row++) {
                for(let col=0; col<INVADER_COLS; col++) {
                    if(invaders[row][col]) {
                        aliveList.push({row, col});
                    }
                }
            }
            if(aliveList.length === 0) return; // ya no hay enemigos
            
            const randomIndex = Math.floor(Math.random() * aliveList.length);
            const inv = aliveList[randomIndex];
            // calcular posición exacta (en draw se ubican, usamos misma lógica)
            const marginLeft = 70;
            const marginTop = 70;
            const spacingX = 72;
            const spacingY = 58;
            const invW = 48;
            const invH = 40;
            let invaderX = marginLeft + inv.col * spacingX;
            let invaderY = marginTop + inv.row * spacingY;
            // ajuste centro del disparo
            enemyBullets.push({
                x: invaderX + invW/2 - ENEMY_BULLET_W/2,
                y: invaderY + invH,
                active: true,
                w: ENEMY_BULLET_W,
                h: ENEMY_BULLET_H
            });
        }
        
        // Actualizar lógica cada frame
        function updateGame() {
            if(gameOver) return;
            
            // 1) cooldowns
            if(shotCooldown > 0) shotCooldown--;
            if(enemyShootCooldown > 0) enemyShootCooldown--;
            
            // 2) movimiento jugador
            let speed = 7;
            if(keys.ArrowLeft && playerX > 5) playerX -= speed;
            if(keys.ArrowRight && playerX < W - PLAYER_WIDTH - 5) playerX += speed;
            
            // 3) disparo jugador (tecla espacio)
            if(keys.Space && !gameOver) {
                if(shotCooldown === 0) shootFromPlayer();
            }
            
            // 4) mover balas del jugador
            for(let i=0; i<bullets.length; i++) {
                bullets[i].y += BULLET_SPEED;
                if(bullets[i].y + BULLET_H < 0 || bullets[i].y > H) {
                    bullets.splice(i,1);
                    i--;
                    continue;
                }
            }
            
            // 5) COLISIONES: balas vs invasores (matriz)
            for(let i=0; i<bullets.length; i++) {
                const bullet = bullets[i];
                let hit = false;
                for(let row=0; row<INVADER_ROWS; row++) {
                    for(let col=0; col<INVADER_COLS; col++) {
                        if(invaders[row][col]) {
                            // calcular hitbox invader
                            const marginLeft = 70;
                            const marginTop = 70;
                            const spacingX = 72;
                            const spacingY = 58;
                            const invW = 48;
                            const invH = 40;
                            let invX = marginLeft + col * spacingX;
                            let invY = marginTop + row * spacingY;
                            // colisión
                            if(rectCollide(
                                {x: bullet.x, y: bullet.y, w: BULLET_W, h: BULLET_H},
                                {x: invX, y: invY, w: invW, h: invH}
                            )) {
                                // destruir invader
                                invaders[row][col] = false;
                                hit = true;
                                score += 10;
                                updateUI();
                                // añadir explosión pequeña
                                explosionFrames.push({x: invX+invW/2, y: invY+invH/2, timer: 8});
                                break;
                            }
                        }
                    }
                    if(hit) break;
                }
                if(hit) {
                    bullets.splice(i,1);
                    i--;
                }
            }
            
            // 6) movimiento de los marcianos (ronda)
            // velocidad variable según número de enemigos restantes (más rápido)
            let aliveCount = 0;
            for(let row=0; row<INVADER_ROWS; row++)
                for(let col=0; col<INVADER_COLS; col++)
                    if(invaders[row][col]) aliveCount++;
            
            if(aliveCount === 0) {
                // ¡VICTORIA! - reiniciamos oleada pero conservamos vidas y sumamos bonus
                gameOver = true;
                // mensaje especial, no reinicio automático, mostraremos texto y botón reinicio
                // Pero para experiencia: se puede reiniciar ronda.
                // mostramos game over con mensaje "YOU WIN!"
                return;
            }
            
            // ajustar velocidad dinámica (cuantos menos quedan más rápido)
            let dynamicSpeed = Math.max(12, INVADER_BASE_SPEED - Math.floor((45 - aliveCount)/6));
            invaderSpeed = Math.min(INVADER_BASE_SPEED, dynamicSpeed);
            
            if(moveWait <= 0) {
                // mover horizontalmente todos los invasores vivos (desplazamiento basado en dirección global)
                // Para mover necesitamos saber si alguno toca borde, para cambiar dirección y bajar
                let needStepDown = false;
                let leftmostCol = INVADER_COLS;
                let rightmostCol = -1;
                for(let row=0; row<INVADER_ROWS; row++) {
                    for(let col=0; col<INVADER_COLS; col++) {
                        if(invaders[row][col]) {
                            if(col < leftmostCol) leftmostCol = col;
                            if(col > rightmostCol) rightmostCol = col;
                        }
                    }
                }
                if(leftmostCol !== INVADER_COLS) { // hay enemigos
                    const marginLeft = 70;
                    const spacingX = 72;
                    let leftEdgeX = marginLeft + leftmostCol * spacingX;
                    let rightEdgeX = marginLeft + rightmostCol * spacingX + 48;
                    if(invaderDirection === 1 && rightEdgeX >= W - 30) {
                        invaderDirection = -1;
                        needStepDown = true;
                    } else if(invaderDirection === -1 && leftEdgeX <= 30) {
                        invaderDirection = 1;
                        needStepDown = true;
                    }
                }
                
                // aplicar el desplazamiento lógico: en realidad no guardamos posiciones absolutas
                // solo necesitamos la dirección. Pero como pintamos según matriz y desplazamiento incremental,
                // en este diseño NO guardamos posición acumulativa de invasores, si no que cada frame se dibujan según columnas fijas.
                // PERO para que se muevan realmente necesitamos un desplazamiento offset acumulado? 
                // En la mayoría de juegos se guarda un offsetX y offsetY. En mi versión actual solo se dibujan con margen fijo.
                // ¡Debemos implementar offset variable! Así que mejor creamos variables invaderOffsetX e invaderOffsetY.
                // Refactor rápido: añadimos invaderOffsetX que se modifica según dirección y stepdown.
                // Vamos a agregarlas.
            }
        }
        
        // Debemos añadir variables de desplazamiento para invasores y reescribir lógica de movimiento y colisiones.
        // Refactorización para que el juego funcione correctamente: usaremos offset global.
        let invaderOffsetX = 0;
        let invaderOffsetY = 0;
        // Rehacer parcialmente update con offset.
        // Como es código en vivo, mejor redefino completamente el bucle principal con offset.
        // Reescribo de forma ordenada:
        
        // ------ NUEVA VERSIÓN CON OFFSET DE INVASORES ------
        // Reseteo de offset al reiniciar
        function resetOffset() {
            invaderOffsetX = 0;
            invaderOffsetY = 0;
        }
        
        // Modifico restartGame para incluir resetOffset
        const originalRestart = restartGame;
        window.restartGame = function() {
            originalRestart();
            resetOffset();
            gameOver = false;
            updateUI();
        };
        restartGame = function() {
            invaders = [];
            for(let row = 0; row < INVADER_ROWS; row++) {
                invaders[row] = [];
                for(let col = 0; col < INVADER_COLS; col++) {
                    invaders[row][col] = true;
                }
            }
            lives = 3;
            score = 0;
            bullets = [];
            enemyBullets = [];
            explosionFrames = [];
            shotCooldown = 0;
            enemyShootCooldown = 0;
            invaderDirection = 1;
            moveWait = 0;
            invaderSpeed = INVADER_BASE_SPEED;
            playerX = W/2 - PLAYER_WIDTH/2;
            gameOver = false;
            invaderOffsetX = 0;
            invaderOffsetY = 0;
            updateUI();
        };
        
        // Calcular posición real de invader según su col/row + offset
        function getInvaderPos(col, row) {
            const baseX = 70;
            const baseY = 70;
            const spacingX = 72;
            const spacingY = 58;
            return {
                x: baseX + col * spacingX + invaderOffsetX,
                y: baseY + row * spacingY + invaderOffsetY,
                w: 48,
                h: 40
            };
        }
        
        // Actualización completa usando offsets
        function updateGameWithOffset() {
            if(gameOver) return;
            
            // 1) cooldowns
            if(shotCooldown > 0) shotCooldown--;
            if(enemyShootCooldown > 0) enemyShootCooldown--;
            
            // mover jugador
            let speed = 7;
            if(keys.ArrowLeft && playerX > 5) playerX -= speed;
            if(keys.ArrowRight && playerX < W - PLAYER_WIDTH - 5) playerX += speed;
            
            if(keys.Space && shotCooldown === 0 && !gameOver) shootFromPlayer();
            
            // balas jugador
            for(let i=0; i<bullets.length; i++) {
                bullets[i].y += BULLET_SPEED;
                if(bullets[i].y + BULLET_H < 0 || bullets[i].y > H) {
                    bullets.splice(i,1);
                    i--;
                }
            }
            
            // colisiones balas vs invasores (usando getInvaderPos)
            for(let i=0; i<bullets.length; i++) {
                const bullet = bullets[i];
                let hit = false;
                for(let row=0; row<INVADER_ROWS; row++) {
                    for(let col=0; col<INVADER_COLS; col++) {
                        if(invaders[row][col]) {
                            const invRect = getInvaderPos(col, row);
                            if(rectCollide(
                                {x: bullet.x, y: bullet.y, w: BULLET_W, h: BULLET_H},
                                invRect
                            )) {
                                invaders[row][col] = false;
                                hit = true;
                                score += 10;
                                updateUI();
                                explosionFrames.push({x: invRect.x+invRect.w/2, y: invRect.y+invRect.h/2, timer: 10});
                                break;
                            }
                        }
                    }
                    if(hit) break;
                }
                if(hit) {
                    bullets.splice(i,1);
                    i--;
                }
            }
            
            // contar enemigos vivos
            let aliveCount = 0;
            for(let row=0; row<INVADER_ROWS; row++)
                for(let col=0; col<INVADER_COLS; col++)
                    if(invaders[row][col]) aliveCount++;
            
            if(aliveCount === 0) {
                gameOver = true;
                return;
            }
            
            // movimiento de invasores (con offset)
            if(moveWait <= 0) {
                // calcular extremos reales según posición actual
                let minX = 9999, maxX = -9999;
                for(let row=0; row<INVADER_ROWS; row++) {
                    for(let col=0; col<INVADER_COLS; col++) {
                        if(invaders[row][col]) {
                            const rect = getInvaderPos(col, row);
                            if(rect.x < minX) minX = rect.x;
                            if(rect.x + rect.w > maxX) maxX = rect.x + rect.w;
                        }
                    }
                }
                let needStepDown = false;
                if(invaderDirection === 1 && maxX >= W - 20) {
                    invaderDirection = -1;
                    needStepDown = true;
                } else if(invaderDirection === -1 && minX <= 15) {
                    invaderDirection = 1;
                    needStepDown = true;
                }
                
                // desplazar
                let stepX = invaderDirection * 9;  // pixeles por movimiento
                invaderOffsetX += stepX;
                if(needStepDown) {
                    invaderOffsetY += 18;
                    // aumentar velocidad cuando bajan
                    invaderSpeed = Math.max(12, invaderSpeed - 1);
                }
                moveWait = invaderSpeed;
                
                // verificar si invadieron la tierra (tocan nave o superan Y)
                for(let row=0; row<INVADER_ROWS; row++) {
                    for(let col=0; col<INVADER_COLS; col++) {
                        if(invaders[row][col]) {
                            const invPos = getInvaderPos(col, row);
                            if(invPos.y + invPos.h >= playerY + 10) {
                                gameOver = true;
                                return;
                            }
                        }
                    }
                }
            } else {
                moveWait--;
            }
            
            // Disparos enemigos periódicos
            if(enemyShootCooldown === 0 && aliveCount > 0 && !gameOver) {
                enemyShoot();
                enemyShootCooldown = ENEMY_SHOOT_DELAY_BASE + Math.floor(Math.random() * 15);
            }
            
            // mover balas enemigas
            for(let i=0; i<enemyBullets.length; i++) {
                enemyBullets[i].y += ENEMY_BULLET_SPEED;
                if(enemyBullets[i].y > H + 50 || enemyBullets[i].y + ENEMY_BULLET_H < 0) {
                    enemyBullets.splice(i,1);
                    i--;
                    continue;
                }
                // colisión con jugador
                const bullet = enemyBullets[i];
                const playerRect = {x: playerX, y: playerY, w: PLAYER_WIDTH, h: PLAYER_HEIGHT};
                if(rectCollide({x: bullet.x, y: bullet.y, w: ENEMY_BULLET_W, h: ENEMY_BULLET_H}, playerRect)) {
                    // perder vida
                    lives--;
                    updateUI();
                    enemyBullets.splice(i,1);
                    i--;
                    if(lives <= 0) {
                        gameOver = true;
                    } else {
                        // efecto de parpadeo: explosión en nave
                        explosionFrames.push({x: playerX+PLAYER_WIDTH/2, y: playerY+PLAYER_HEIGHT/2, timer: 12});
                        // reset posición nave centro
                        playerX = W/2 - PLAYER_WIDTH/2;
                    }
                    continue;
                }
            }
            
            // actualizar explosiones
            for(let i=0; i<explosionFrames.length; i++) {
                explosionFrames[i].timer--;
                if(explosionFrames[i].timer <= 0) {
                    explosionFrames.splice(i,1);
                    i--;
                }
            }
        }
        
        // ---------- DIBUJO (retro pixel) ----------
        function draw() {
            ctx.clearRect(0, 0, W, H);
            // Fondo estrellado
            ctx.fillStyle = "#010008";
            ctx.fillRect(0,0,W,H);
            ctx.fillStyle = "#ffffff";
            for(let i=0; i<150; i++) {
                if(i%2 === 0) continue;
                ctx.fillRect( (i*131)%W, (i*97)%H, 1.5, 1.5);
            }
            
            // Nave del jugador
            ctx.fillStyle = "#4eff6e";
            ctx.shadowBlur = 0;
            ctx.fillRect(playerX, playerY, PLAYER_WIDTH, PLAYER_HEIGHT);
            ctx.fillStyle = "#b3ffb3";
            ctx.fillRect(playerX+6, playerY-6, 24, 8);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(playerX+14, playerY-3, 8, 5);
            
            // Marcianos (dibujar según matriz y offset)
            for(let row=0; row<INVADER_ROWS; row++) {
                for(let col=0; col<INVADER_COLS; col++) {
                    if(invaders[row][col]) {
                        const pos = getInvaderPos(col, row);
                        // estilo alien
                        ctx.fillStyle = "#43ff7c";
                        if(row===0) ctx.fillStyle = "#ffc857";
                        if(row===1) ctx.fillStyle = "#7eff6e";
                        if(row>=2) ctx.fillStyle = "#40c94b";
                        ctx.fillRect(pos.x, pos.y, pos.w, pos.h);
                        ctx.fillStyle = "#000000";
                        ctx.fillRect(pos.x+10, pos.y+12, 8, 8);
                        ctx.fillRect(pos.x+30, pos.y+12, 8, 8);
                        ctx.fillStyle = "#ffaa44";
                        ctx.fillRect(pos.x+20, pos.y+28, 8, 6);
                        // antena
                        ctx.fillStyle = "#90ff70";
                        ctx.fillRect(pos.x+22, pos.y-5, 4, 8);
                    }
                }
            }
            
            // Balas jugador
            ctx.fillStyle = "#ffff60";
            for(let b of bullets) ctx.fillRect(b.x, b.y, BULLET_W, BULLET_H);
            // Balas enemigas
            ctx.fillStyle = "#ff5555";
            for(let eb of enemyBullets) ctx.fillRect(eb.x, eb.y, ENEMY_BULLET_W, ENEMY_BULLET_H);
            
            // Explosiones
            for(let ex of explosionFrames) {
                ctx.fillStyle = `rgba(255, 140, 30, ${ex.timer/8})`;
                ctx.beginPath();
                ctx.arc(ex.x, ex.y, 12 - (ex.timer/2), 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = `rgba(255, 80, 30, 0.9)`;
                ctx.beginPath();
                ctx.arc(ex.x-2, ex.y-2, 5, 0, Math.PI*2);
                ctx.fill();
            }
            
            // Game over o victoria
            if(gameOver) {
                let aliveCount = 0;
                for(let row=0; row<INVADER_ROWS; row++)
                    for(let col=0; col<INVADER_COLS; col++)
                        if(invaders[row][col]) aliveCount++;
                let msg = (aliveCount === 0) ? "🌟 ¡VICTORIA! 🌟" : "💀 GAME OVER 💀";
                ctx.font = "bold 34monospace";
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#fffdd0";
                ctx.shadowColor = "black";
                ctx.fillText(msg, W/2-130, H/2-40);
                ctx.font = "18px monospace";
                ctx.fillStyle = "#aaffaa";
                ctx.fillText("Presiona 'NUEVA NAVE'", W/2-100, H/2+30);
            }
            
            // Hud marca
            ctx.font = "bold 16px monospace";
            ctx.fillStyle = "#b3ffb3";
            ctx.fillText("👾 INVASORES", 20, 35);
        }
        
        // Loop principal
        let lastTimestamp = 0;
        function gameLoop() {
            if(!gameOver) updateGameWithOffset();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Eventos teclado
        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft') { keys.ArrowLeft = true; e.preventDefault(); }
            else if(e.key === 'ArrowRight') { keys.ArrowRight = true; e.preventDefault(); }
            else if(e.key === ' ' || e.key === 'Space') { keys.Space = true; e.preventDefault(); }
        });
        window.addEventListener('keyup', (e) => {
            if(e.key === 'ArrowLeft') keys.ArrowLeft = false;
            else if(e.key === 'ArrowRight') keys.ArrowRight = false;
            else if(e.key === ' ' || e.key === 'Space') keys.Space = false;
        });
        document.getElementById('restartButton').addEventListener('click', () => {
            restartGame();
            gameOver = false;
        });
        
        // Inicializar
        restartGame();
        updateUI();
        gameLoop();
    })();
</script>
</body>
</html>
